name: Sync observability branch

# Publishes deploy/observability of `main` as the root of the orphan branch `observability-deploy`, which the Coolify of
# every VPS deploys with the compose location /docker-compose.yaml (deploy/observability/README.md).
#
# A push to the branch triggers the Coolify webhooks, so the workflow pushes only when the tree of the stack differs from the
# tree already on the branch: a run with the same stack leaves the branch and the running stores alone.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/observability/**'
      - '.github/workflows/sync-observability-branch.yml'
  workflow_dispatch:

concurrency:
  # Queue instead of cancelling, so the last commit on main always ends up published.
  group: sync-observability-branch
  cancel-in-progress: false

env:
  STACK_PATH: deploy/observability
  DEPLOY_BRANCH: observability-deploy

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the stack of main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: deploy/observability

      - name: Push to ${{ env.DEPLOY_BRANCH }} when the stack changed
        run: |
          set -euo pipefail
          tree=$(git rev-parse "HEAD:${STACK_PATH}")
          if ! git cat-file -e "${tree}:docker-compose.yaml"; then
            echo "::error::${STACK_PATH}/docker-compose.yaml missing in ${GITHUB_SHA}"
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "$DEPLOY_BRANCH" > /dev/null; then
            git fetch -q --depth 1 --filter=blob:none origin "refs/heads/${DEPLOY_BRANCH}"
            current=$(git rev-parse "FETCH_HEAD^{tree}")
            if [ "$current" = "$tree" ]; then
              echo "Stack tree ${tree} is already on ${DEPLOY_BRANCH}: no push" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          # A parentless commit of the stack tree: the branch is generated output, never a place to commit by hand.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          commit=$(git commit-tree "$tree" \
            -m "Observability stack of main @ ${GITHUB_SHA:0:7}" \
            -m "Generated by .github/workflows/sync-observability-branch.yml from ${STACK_PATH}, do not commit here.

          Source-commit: ${GITHUB_SHA}")
          git push --force origin "${commit}:refs/heads/${DEPLOY_BRANCH}"
          echo "Published stack tree ${tree} as ${commit} on ${DEPLOY_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
