name: CI

# Builds the framework (common, shared, backend, ContainerGenerator), runs the framework and common tests and the
# generator harness.
# Unity packages are compiled and tested inside the projects.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build framework.slnx

      # Microsoft Testing Platform: on the .NET 10 SDK `dotnet test` refuses, the test executable is run directly.
      - name: Framework tests
        run: .build/bin/Tests/Debug/net10.0/Framework.Tests

      - name: Common tests
        run: .build/bin/Framework.Common.Tests/Debug/net10.0/Framework.Common.Tests

      - name: Verify ContainerGenerator
        run: dotnet run --project 'client/core/Source~/ContainerGenerator.Verify/ContainerGenerator.Verify.csproj' -c Release
